<!-- ==========================================================
     LOGIN PAGE
=========================================================== -->

<div id="loginContainer" class="login-container">

    <!-- ===============================================
         Left Side
    ================================================ -->

    <div class="login-left">

        <div class="login-brand">

            <img
            id="companyLogo"
            src=""
            alt="Application logo"
            width="220"
            height="220"
            decoding="async"
            data-app-logo>

            <h2 class="login-portal-title" aria-label="TrueMeds_HyperLocal_Logistics_Portal">

                <span id="loginPortalTypewriter" data-login-typewriter data-i18n-ignore></span>

            </h2>

            <p>

                Fast • Secure • Reliable

            </p>

        </div>

    </div>


    <!-- ===============================================
         Right Side
    ================================================ -->

    <div class="login-right">

        <div class="login-card">

            <h2>

                Welcome Back

            </h2>

            <p>

                Sign in to continue

            </p>


            <!-- Username -->

            <div class="form-group">

                <label>

                    Username

                </label>

                <input
                    type="text"
                    id="loginUsername"
                    class="form-control"
                    maxlength="50"
                    autocomplete="username"
                    placeholder="Enter Username">

            </div>


            <!-- Password -->

            <div class="form-group">

                <label>

                    Password

                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="loginPassword"
                        class="form-control"
                        maxlength="100"
                        autocomplete="current-password"
                        placeholder="Enter Password">

                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle">

                        <span class="material-symbols-outlined">
                         visibility
                         </span>

                    </button>

                </div>

            </div>


            <!-- Remember Me -->

            <div class="remember-row">

                <label class="remember-label">

                    <input
                        type="checkbox"
                        id="rememberMe">

                    Remember Me

                </label>

            </div>

            <button type="button" id="btnForgotPassword" class="login-recovery-link">
                <span class="material-symbols-outlined" aria-hidden="true">lock_reset</span>
                Forgot password or account locked?
            </button>


            <!-- Login -->

            <button
                id="btnLogin"
                class="primary-btn">

                Login

            </button>


            <!-- Error -->

            <div
                id="loginError"
                class="login-error hidden">

            </div>


            <!-- Footer -->

            <div class="login-footer">

                <span id="loginVersion">

                    <span data-app-version></span>

                </span>

            </div>

        </div>

    </div>

</div>
