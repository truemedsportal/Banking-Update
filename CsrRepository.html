<div class="page-container csr-page-container">
  <div class="page-header"><div><h1>CSR Repository</h1><p>Search the complete calling history and review operational outcomes.</p></div><button id="btnRefreshCsrRepository" class="secondary-btn" type="button">Search</button></div>
  <div class="card"><div class="card-body"><div class="form-grid csr-filter-grid">
    <div class="form-group"><label>Search</label><input id="txtCsrRepositorySearch" class="form-control" placeholder="Ticket ID, submission ID, order number, rider, or agent"></div>
    <div class="form-group"><label>Final Status</label><select id="ddlCsrRepositoryStatus" class="form-control"><option value="">All tickets</option><option value="OPEN">Open</option><option value="CLOSED">Closed</option></select></div>
    <div class="form-group"><label>Created from</label><input id="dtCsrRepositoryCreatedFrom" class="form-control" type="date"></div>
    <div class="form-group"><label>Created to</label><input id="dtCsrRepositoryCreatedTo" class="form-control" type="date"></div>
  </div></div></div>
  <div class="card"><div class="card-body table-responsive"><table class="table"><thead><tr><th>CSR Ticket ID</th><th>Submission ID</th><th>Order Number</th><th>Zone</th><th>LM Hub</th><th>Final Status</th><th>Final Outcome</th><th>Assigned Agent</th><th>Created At</th><th>Closed At</th></tr></thead><tbody id="csrRepositoryBody"><tr><td colspan="10">Search CSR history.</td></tr></tbody></table></div></div>
</div>
